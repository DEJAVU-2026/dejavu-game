<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DEJAVU 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #030712; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Race Select Screen */
        #race-select {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.94); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        #race-select h1 { color: #f8fafc; font-size: 26px; letter-spacing: 3px; margin-bottom: 25px; text-shadow: 0 0 15px #8b5cf6; }
        .race-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 320px; }
        .race-btn {
            background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.6);
            color: #fff; padding: 18px 10px; text-align: center; font-weight: bold;
            border-radius: 12px; cursor: pointer; text-transform: uppercase; font-size: 13px;
        }
        .race-btn:active { background: #8b5cf6; transform: scale(0.95); }

        /* HUD & MINIMAP UI */
        #hud { display: none; width: 100%; height: 100%; position: relative; }
        
        /* MiniMap Canvas */
        #minimap-container {
            position: absolute; top: 20px; right: 20px; width: 110px; height: 110px;
            border-radius: 50%; border: 2px solid rgba(139, 92, 246, 0.8);
            background: rgba(3, 7, 18, 0.75); overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(139, 92, 246, 0.3);
        }
        #minimap { width: 100%; height: 100%; }

        #ability-btn {
            position: absolute; bottom: 35px; right: 35px; width: 85px; height: 85px;
            background: radial-gradient(circle, #8b5cf6 0%, #4c1d95 100%);
            border: 2px solid #ddd6fe; border-radius: 50%; color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.7); font-size: 13px; text-align: center;
        }
        #ability-btn:active { transform: scale(0.92); }

        #joystick-zone { position: absolute; bottom: 35px; left: 35px; width: 120px; height: 120px; border: 2px dashed rgba(255,255,255,0.25); border-radius: 50%; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div id="race-select" class="interactive">
            <h1>SELECT YOUR RACE</h1>
            <div class="race-grid">
                <div class="race-btn" onclick="selectRace('WEREWOLF')">Werewolf</div>
                <div class="race-btn" onclick="selectRace('VAMPIRE')">Vampire</div>
                <div class="race-btn" onclick="selectRace('CADAVER')">Cadaver</div>
                <div class="race-btn" onclick="selectRace('GHOST')">Ghost</div>
            </div>
        </div>
        <div id="hud">
            <!-- Minimap -->
            <div id="minimap-container">
                <canvas id="minimap" width="110" height="110"></canvas>
            </div>

            <div id="joystick-zone" class="interactive">
                <div id="joystick-stick"></div>
            </div>
            <div id="ability-btn" class="interactive" onclick="triggerAbility()">ABILITY</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer, playerGroup, loadedCharacterMesh;
        let mixer, actions = {}, currentAction;
        let torchLights = [], enemies = [];
        let currentRace = null;
        let moveVector = new THREE.Vector3();
        let isPouncing = false, pounceDirection = new THREE.Vector3(), pounceSpeed = 32;
        let lastAbilityTime = 0;
        const clock = new THREE.Clock();

        // Minimap setup
        let mapCanvas, mapCtx;

        const RACES = {
            WEREWOLF: { name: 'Werewolf', color: 0xc084fc, speed: 11, cooldown: 4000, abilityName: 'Pounce' },
            VAMPIRE: { name: 'Vampire', color: 0xf87171, speed: 10, cooldown: 5000, abilityName: 'Siphon' },
            CADAVER: { name: 'Cadaver', color: 0x4ade80, speed: 8.5, cooldown: 8000, abilityName: 'Slam' },
            GHOST: { name: 'Ghost', color: 0x38bdf8, speed: 12.5, cooldown: 6000, abilityName: 'Phase' }
        };

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030712);
            scene.fog = new THREE.FogExp2(0x030712, 0.025);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Subtle Post-Processing Bloom
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.5,  // Milder strength so rings don't blind the screen
                0.4, 
                0.85
            );

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Brightened Light Setup so player textures show clearly
            const ambient = new THREE.AmbientLight(0x64748b, 1.2);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(15, 25, 10);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Setup Minimap Canvas
            mapCanvas = document.getElementById('minimap');
            mapCtx = mapCanvas.getContext('2d');

            buildDungeonArena();
            spawnEnemies();

            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            loadCharacterModel();

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            animate();
        }

        function buildDungeonArena() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7, metalness: 0.1 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(60, 30, 0x6366f1, 0x1f2937);
            grid.position.y = 0.01;
            scene.add(grid);

            // Pillars
            const colGeo = new THREE.BoxGeometry(2, 9, 2);
            const colMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 });
            
            const positions = [
                [-16, 4.5, -16], [16, 4.5, -16], [-16, 4.5, 16], [16, 4.5, 16],
                [-8, 4.5, -16], [8, 4.5, -16], [-16, 4.5, 0], [18, 4.5, 0]
            ];

            positions.forEach(pos => {
                const col = new THREE.Mesh(colGeo, colMat);
                col.position.set(...pos);
                col.castShadow = true;
                scene.add(col);

                // Torch Light
                const torchLight = new THREE.PointLight(0xf59e0b, 2, 12);
                torchLight.position.set(pos[0], 5.5, pos[2]);
                scene.add(torchLight);
                torchLights.push(torchLight);
            });

            // Small Dungeon Exit Arch/Portal far at the end
            const portalGeo = new THREE.TorusGeometry(2, 0.2, 16, 32);
            const portalMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, emissive: 0x6d28d9, emissiveIntensity: 0.6 });
            const portal = new THREE.Mesh(portalGeo, portalMat);
            portal.position.set(0, 2.5, -25);
            scene.add(portal);
        }

        function spawnEnemies() {
            const enemyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
            const enemyGeo = new THREE.CylinderGeometry(0.7, 0.7, 2, 16);

            for (let i = 0; i < 3; i++) {
                const enemy = new THREE.Mesh(enemyGeo, enemyMat);
                enemy.position.set((i - 1) * 9, 1, -8);
                enemy.castShadow = true;
                scene.add(enemy);
                enemies.push(enemy);
            }
        }

        function loadCharacterModel() {
            const loader = new GLTFLoader();
            const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb';

            loader.load(modelUrl, (gltf) => {
                loadedCharacterMesh = gltf.scene;
                loadedCharacterMesh.scale.set(1.4, 1.4, 1.4);
                
                // Rotate model inside group so it faces forward!
                loadedCharacterMesh.rotation.y = Math.PI;

                loadedCharacterMesh.traverse((child) => {
                    if (child.isMesh) child.castShadow = true;
                });

                mixer = new THREE.AnimationMixer(loadedCharacterMesh);
                gltf.animations.forEach((clip) => {
                    actions[clip.name] = mixer.clipAction(clip);
                });

                if (actions['Idle']) {
                    actions['Idle'].play();
                    currentAction = actions['Idle'];
                }

                playerGroup.add(loadedCharacterMesh);
            });
        }

        function setAnimation(name) {
            if (!mixer || !actions[name] || currentAction === actions[name]) return;
            if (currentAction) currentAction.fadeOut(0.2);
            actions[name].reset().fadeIn(0.2).play();
            currentAction = actions[name];
        }

        window.selectRace = function(raceKey) {
            currentRace = RACES[raceKey];
            document.getElementById('race-select').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('ability-btn').innerText = currentRace.abilityName;
        };

        window.triggerAbility = function() {
            if (!currentRace) return;
            const now = Date.now();
            if (now - lastAbilityTime < currentRace.cooldown) return;
            lastAbilityTime = now;

            if (currentRace.name === 'Werewolf') {
                isPouncing = true;
                playerGroup.getWorldDirection(pounceDirection);
                setTimeout(() => isPouncing = false, 280);
            } else if (currentRace.name === 'Vampire' || currentRace.name === 'Cadaver') {
                createPulseEffect(currentRace.color);
            } else if (currentRace.name === 'Ghost') {
                const origSpeed = currentRace.speed;
                currentRace.speed *= 1.8;
                setTimeout(() => currentRace.speed = origSpeed, 3000);
            }
        };

        function createPulseEffect(colorHex) {
            const ringGeo = new THREE.RingGeometry(0.2, 5, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(playerGroup.position);
            ring.position.y = 0.08;
            scene.add(ring);
            let scale = 1;
            const interval = setInterval(() => {
                scale += 0.3;
                ring.scale.set(scale, scale, 1);
                ring.material.opacity -= 0.08;
                if (ring.material.opacity <= 0) {
                    clearInterval(interval);
                    scene.remove(ring);
                }
            }, 30);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let active = false, startX, startY;

            zone.addEventListener('touchstart', (e) => {
                active = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!active) return;
                const touch = e.touches[0];
                let dx = touch.clientX - startX;
                let dy = touch.clientY - startY;
                const dist = Math.min(Math.hypot(dx, dy), 35);
                const angle = Math.atan2(dy, dx);
                
                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;
                stick.style.transform = `translate(${stickX}px, ${stickY}px)`;

                moveVector.set(stickX / 35, 0, stickY / 35);
            });

            window.addEventListener('touchend', () => {
                active = false;
                stick.style.transform = `translate(0px, 0px)`;
                moveVector.set(0, 0, 0);
            });
        }

        function drawMinimap() {
            if (!mapCtx) return;
            const size = 110;
            const center = size / 2;
            const scale = 1.8; // Arena to map scale

            mapCtx.clearRect(0, 0, size, size);

            // Draw Player (Green dot)
            const px = center + playerGroup.position.x * scale;
            const py = center + playerGroup.position.z * scale;

            mapCtx.fillStyle = '#22c55e';
            mapCtx.beginPath();
            mapCtx.arc(px, py, 4, 0, Math.PI * 2);
            mapCtx.fill();

            // Draw Enemies (Red dots)
            mapCtx.fillStyle = '#ef4444';
            enemies.forEach(e => {
                const ex = center + e.position.x * scale;
                const ey = center + e.position.z * scale;
                mapCtx.beginPath();
                mapCtx.arc(ex, ey, 3, 0, Math.PI * 2);
                mapCtx.fill();
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);

            if (currentRace) {
                if (isPouncing) {
                    playerGroup.position.addScaledVector(pounceDirection, pounceSpeed * delta);
                    setAnimation('Run');
                } else if (moveVector.lengthSq() > 0.01) {
                    playerGroup.position.x += moveVector.x * currentRace.speed * delta;
                    playerGroup.position.z += moveVector.z * currentRace.speed * delta;
                    
                    // Fixed facing direction (no more moonwalking!)
                    playerGroup.rotation.y = Math.atan2(moveVector.x, moveVector.z);
                    setAnimation('Run');
                } else {
                    setAnimation('Idle');
                }
                camera.position.x = playerGroup.position.x;
                camera.position.z = playerGroup.position.z + 12;
                camera.lookAt(playerGroup.position);

                drawMinimap();
            }

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initScene;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DEJAVU 3D - Character Creation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050a; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Character Creation Screens */
        .selection-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 12, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .selection-screen h1 { color: #f8fafc; font-size: 24px; letter-spacing: 3px; margin-bottom: 25px; text-shadow: 0 0 15px #8b5cf6; text-transform: uppercase; }
        
        .gender-grid { display: flex; gap: 20px; width: 85%; max-width: 320px; }
        .race-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 320px; }
        
        .btn-option {
            flex: 1; background: rgba(139, 92, 246, 0.15); border: 2px solid rgba(139, 92, 246, 0.6);
            color: #fff; padding: 20px 10px; text-align: center; font-weight: bold;
            border-radius: 14px; cursor: pointer; text-transform: uppercase; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.2s;
        }
        .btn-option:active { background: #8b5cf6; transform: scale(0.95); }

        /* HUD & MINIMAP UI */
        #hud { display: none; width: 100%; height: 100%; position: relative; }
        
        #minimap-container {
            position: absolute; top: 20px; right: 20px; width: 110px; height: 110px;
            border-radius: 50%; border: 2px solid rgba(139, 92, 246, 0.8);
            background: rgba(5, 5, 12, 0.85); overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(139, 92, 246, 0.4);
        }
        #minimap { width: 100%; height: 100%; }

        #hero-info {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-weight: bold; font-size: 14px; text-shadow: 0 0 10px #8b5cf6;
            background: rgba(5,5,12,0.6); padding: 8px 14px; border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        #ability-btn {
            position: absolute; bottom: 35px; right: 35px; width: 85px; height: 85px;
            background: radial-gradient(circle, #8b5cf6 0%, #4c1d95 100%);
            border: 2px solid #ddd6fe; border-radius: 50%; color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.7); font-size: 13px; text-align: center;
        }
        #ability-btn:active { transform: scale(0.92); }

        #joystick-zone { position: absolute; bottom: 35px; left: 35px; width: 120px; height: 120px; border: 2px dashed rgba(255,255,255,0.25); border-radius: 50%; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <!-- 1. GENDER SELECTION -->
        <div id="gender-select" class="selection-screen interactive">
            <h1>Обери стать героя</h1>
            <div class="gender-grid">
                <div class="btn-option" onclick="chooseGender('MALE')">Чоловік ♂</div>
                <div class="btn-option" onclick="chooseGender('FEMALE')">Жінка ♀</div>
            </div>
        </div>

        <!-- 2. RACE SELECTION -->
        <div id="race-select" class="selection-screen interactive" style="display: none;">
            <h1>Обери расу</h1>
            <div class="race-grid">
                <div class="btn-option" onclick="selectRace('WEREWOLF')">Вовкулака</div>
                <div class="btn-option" onclick="selectRace('VAMPIRE')">Вампір</div>
                <div class="btn-option" onclick="selectRace('CADAVER')">Кадавр</div>
                <div class="btn-option" onclick="selectRace('GHOST')">Привид</div>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div id="hero-info"><span id="hero-title">HERO</span></div>
            <div id="minimap-container">
                <canvas id="minimap" width="110" height="110"></canvas>
            </div>
            <div id="joystick-zone" class="interactive">
                <div id="joystick-stick"></div>
            </div>
            <div id="ability-btn" class="interactive" onclick="triggerAbility()">ABILITY</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer, playerGroup, playerLight;
        let selectedGender = 'MALE';
        let currentRace = null;
        let moveVector = new THREE.Vector3();
        let isPouncing = false, pounceDirection = new THREE.Vector3(), pounceSpeed = 32;
        let lastAbilityTime = 0;
        const clock = new THREE.Clock();

        let mapCanvas, mapCtx;
        let enemies = [], torchLights = [];

        const RACES = {
            WEREWOLF: { name: 'Werewolf', ukr: 'Вовкулака', color: 0xa855f7, isGhost: false, speed: 12, cooldown: 4000, abilityName: 'Pounce' },
            VAMPIRE: { name: 'Vampire', ukr: 'Вампір', color: 0xef4444, isGhost: false, speed: 10.5, cooldown: 5000, abilityName: 'Siphon' },
            CADAVER: { name: 'Cadaver', ukr: 'Кадавр', color: 0x22c55e, isGhost: false, speed: 9, cooldown: 8000, abilityName: 'Slam' },
            GHOST: { name: 'Ghost', ukr: 'Привид', color: 0x06b6d4, isGhost: true, speed: 13, cooldown: 6000, abilityName: 'Phase' }
        };

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c16);
            scene.fog = new THREE.FogExp2(0x0a0c16, 0.02);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            container.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.4, 0.85);

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            const hemiLight = new THREE.HemisphereLight(0xa5b4fc, 0x311b92, 1.4);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
            dirLight.position.set(15, 25, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            mapCanvas = document.getElementById('minimap');
            mapCtx = mapCanvas.getContext('2d');

            buildDungeonArena();
            spawnEnemies();

            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            playerLight = new THREE.PointLight(0xa855f7, 4, 15);
            playerLight.position.set(0, 2.5, 0);
            playerGroup.add(playerLight);

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            animate();
        }

        function buildDungeonArena() {
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(60, 30, 0x818cf8, 0x334155);
            grid.position.y = 0.01;
            scene.add(grid);

            const colGeo = new THREE.BoxGeometry(2.2, 9, 2.2);
            const colMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
            
            const positions = [
                [-16, 4.5, -16], [16, 4.5, -16], [-16, 4.5, 16], [16, 4.5, 16],
                [-8, 4.5, -16], [8, 4.5, -16], [-16, 4.5, 0], [18, 4.5, 0]
            ];

            positions.forEach(pos => {
                const col = new THREE.Mesh(colGeo, colMat);
                col.position.set(...pos);
                col.castShadow = true;
                scene.add(col);

                const torchLight = new THREE.PointLight(0xf59e0b, 2.5, 14);
                torchLight.position.set(pos[0], 5.5, pos[2]);
                scene.add(torchLight);
                torchLights.push(torchLight);
            });
        }

        function spawnEnemies() {
            const enemyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
            const enemyGeo = new THREE.CylinderGeometry(0.75, 0.75, 2, 16);

            for (let i = 0; i < 3; i++) {
                const enemy = new THREE.Mesh(enemyGeo, enemyMat);
                enemy.position.set((i - 1) * 9, 1, -8);
                enemy.castShadow = true;
                scene.add(enemy);
                enemies.push(enemy);
            }
        }

        // Build Stylized Humanoid Hero Body
        function createHumanoidHero() {
            // Remove old character model if exists
            while(playerGroup.children.length > 1) { 
                playerGroup.remove(playerGroup.children[1]); 
            }

            const heroMeshGroup = new THREE.Group();
            const raceColor = currentRace.color;
            const isFemale = selectedGender === 'FEMALE';

            // Humanoid Body Proportions
            const torsoWidth = isFemale ? 0.6 : 0.8;
            const torsoHeight = isFemale ? 1.4 : 1.6;
            const headSize = isFemale ? 0.38 : 0.42;

            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: raceColor, 
                roughness: 0.3, 
                metalness: 0.2,
                transparent: currentRace.isGhost,
                opacity: currentRace.isGhost ? 0.6 : 1.0
            });

            // Torso (Human Body)
            const torsoGeo = new THREE.CylinderGeometry(torsoWidth * 0.8, torsoWidth * 0.6, torsoHeight, 16);
            const torso = new THREE.Mesh(torsoGeo, bodyMat);
            torso.position.y = torsoHeight / 2 + 0.6;
            torso.castShadow = true;
            heroMeshGroup.add(torso);

            // Head
            const headGeo = new THREE.SphereGeometry(headSize, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.y = torso.position.y + torsoHeight / 2 + headSize * 0.8;
            heroMeshGroup.add(head);

            // Glowing Eyes (Humanoid Face Accent)
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.12, head.position.y + 0.05, 0.32);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.12, head.position.y + 0.05, 0.32);
            heroMeshGroup.add(leftEye);
            heroMeshGroup.add(rightEye);

            // Floating Ghost Offset
            if (currentRace.isGhost) {
                heroMeshGroup.position.y = 0.5;
            }

            playerGroup.add(heroMeshGroup);
            playerLight.color.setHex(raceColor);
        }

        window.chooseGender = function(gender) {
            selectedGender = gender;
            document.getElementById('gender-select').style.display = 'none';
            document.getElementById('race-select').style.display = 'flex';
        };

        window.selectRace = function(raceKey) {
            currentRace = RACES[raceKey];
            createHumanoidHero();

            document.getElementById('race-select').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('ability-btn').innerText = currentRace.abilityName;
            
            const genderTag = selectedGender === 'MALE' ? 'Чоловік' : 'Жінка';
            document.getElementById('hero-title').innerText = `${currentRace.ukr} (${genderTag})`;
        };

        window.triggerAbility = function() {
            if (!currentRace) return;
            const now = Date.now();
            if (now - lastAbilityTime < currentRace.cooldown) return;
            lastAbilityTime = now;

            if (currentRace.name === 'Werewolf') {
                isPouncing = true;
                playerGroup.getWorldDirection(pounceDirection);
                setTimeout(() => isPouncing = false, 280);
            } else if (currentRace.name === 'Vampire' || currentRace.name === 'Cadaver') {
                createPulseEffect(currentRace.color);
            } else if (currentRace.name === 'Ghost') {
                const origSpeed = currentRace.speed;
                currentRace.speed *= 1.8;
                setTimeout(() => currentRace.speed = origSpeed, 3000);
            }
        };

        function createPulseEffect(colorHex) {
            const ringGeo = new THREE.RingGeometry(0.2, 5, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(playerGroup.position);
            ring.position.y = 0.08;
            scene.add(ring);
            let scale = 1;
            const interval = setInterval(() => {
                scale += 0.3;
                ring.scale.set(scale, scale, 1);
                ring.material.opacity -= 0.08;
                if (ring.material.opacity <= 0) {
                    clearInterval(interval);
                    scene.remove(ring);
                }
            }, 30);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let active = false, startX, startY;

            zone.addEventListener('touchstart', (e) => {
                active = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!active) return;
                const touch = e.touches[0];
                let dx = touch.clientX - startX;
                let dy = touch.clientY - startY;
                const dist = Math.min(Math.hypot(dx, dy), 35);
                const angle = Math.atan2(dy, dx);
                
                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;
                stick.style.transform = `translate(${stickX}px, ${stickY}px)`;

                moveVector.set(stickX / 35, 0, stickY / 35);
            });

            window.addEventListener('touchend', () => {
                active = false;
                stick.style.transform = `translate(0px, 0px)`;
                moveVector.set(0, 0, 0);
            });
        }

        function drawMinimap() {
            if (!mapCtx) return;
            const size = 110;
            const center = size / 2;
            const scale = 1.8;

            mapCtx.clearRect(0, 0, size, size);

            const px = center + playerGroup.position.x * scale;
            const py = center + playerGroup.position.z * scale;

            mapCtx.fillStyle = '#22c55e';
            mapCtx.beginPath();
            mapCtx.arc(px, py, 4, 0, Math.PI * 2);
            mapCtx.fill();

            mapCtx.fillStyle = '#ef4444';
            enemies.forEach(e => {
                const ex = center + e.position.x * scale;
                const ey = center + e.position.z * scale;
                mapCtx.beginPath();
                mapCtx.arc(ex, ey, 3, 0, Math.PI * 2);
                mapCtx.fill();
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentRace) {
                if (currentRace.isGhost && playerGroup.children[1]) {
                    playerGroup.children[1].position.y = 0.5 + Math.sin(Date.now() * 0.005) * 0.15;
                }

                if (isPouncing) {
                    playerGroup.position.addScaledVector(pounceDirection, pounceSpeed * delta);
                } else if (moveVector.lengthSq() > 0.01) {
                    playerGroup.position.x += moveVector.x * currentRace.speed * delta;
                    playerGroup.position.z += moveVector.z * currentRace.speed * delta;
                    playerGroup.rotation.y = Math.atan2(moveVector.x, moveVector.z);
                }
                camera.position.x = playerGroup.position.x;
                camera.position.z = playerGroup.position.z + 12;
                camera.lookAt(playerGroup.position);

                drawMinimap();
            }

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initScene;
    </script>
</body>
</html>

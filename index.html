<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DEJAVU 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a12; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Race Selection Overlay */
        #race-select {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.92); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        #race-select h1 { color: #fff; font-size: 26px; letter-spacing: 2px; margin-bottom: 25px; text-shadow: 0 0 10px #6c5ce7; }
        .race-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 320px; }
        .race-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 18px 10px; text-align: center; font-weight: bold;
            border-radius: 12px; cursor: pointer; text-transform: uppercase; font-size: 14px;
        }
        .race-btn:active { background: #6c5ce7; transform: scale(0.96); }

        /* HUD UI */
        #hud { display: none; width: 100%; height: 100%; position: relative; }
        #ability-btn {
            position: absolute; bottom: 35px; right: 35px; width: 75px; height: 75px;
            background: rgba(108, 92, 231, 0.85); border: 2px solid #fff; border-radius: 50%;
            color: white; font-weight: bold; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.6); font-size: 12px; text-align: center;
        }
        #ability-btn:active { transform: scale(0.92); background: #6c5ce7; }

        /* Touch Joystick Zone */
        #joystick-zone { position: absolute; bottom: 35px; left: 35px; width: 110px; height: 110px; border: 2px dashed rgba(255,255,255,0.25); border-radius: 50%; }
        #joystick-stick { position: absolute; top: 32px; left: 32px; width: 45px; height: 45px; background: rgba(255,255,255,0.45); border-radius: 50%; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div id="race-select" class="interactive">
            <h1>SELECT YOUR SOUL</h1>
            <div class="race-grid">
                <div class="race-btn" onclick="selectRace('WEREWOLF')">Werewolf</div>
                <div class="race-btn" onclick="selectRace('VAMPIRE')">Vampire</div>
                <div class="race-btn" onclick="selectRace('CADAVER')">Cadaver</div>
                <div class="race-btn" onclick="selectRace('GHOST')">Ghost</div>
            </div>
        </div>
        <div id="hud">
            <div id="joystick-zone" class="interactive">
                <div id="joystick-stick"></div>
            </div>
            <div id="ability-btn" class="interactive" onclick="triggerAbility()">ABILITY</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, playerMesh;
        let currentRace = null;
        let moveVector = new THREE.Vector3();
        let isPouncing = false, pounceDirection = new THREE.Vector3(), pounceSpeed = 28;
        let lastAbilityTime = 0;

        const RACES = {
            WEREWOLF: { name: 'Werewolf', color: 0xa855f7, speed: 10, cooldown: 4000, abilityName: 'Pounce' },
            VAMPIRE: { name: 'Vampire', color: 0xef4444, speed: 10, cooldown: 5000, abilityName: 'Siphon' },
            CADAVER: { name: 'Cadaver', color: 0x22c55e, speed: 8, cooldown: 8000, abilityName: 'Slam' },
            GHOST: { name: 'Ghost', color: 0x06b6d4, speed: 12, cooldown: 6000, abilityName: 'Phase' }
        };

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a101d);
            scene.fog = new THREE.FogExp2(0x0a101d, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 14, 11);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Arena Floor
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(60, 30, 0x3b82f6, 0x1e293b);
            grid.position.y = 0.01;
            scene.add(grid);

            // Player mesh
            const geo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            playerMesh = new THREE.Mesh(geo, mat);
            playerMesh.position.y = 1;
            scene.add(playerMesh);

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            animate();
        }

        function selectRace(raceKey) {
            currentRace = RACES[raceKey];
            playerMesh.material.color.setHex(currentRace.color);
            document.getElementById('race-select').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('ability-btn').innerText = currentRace.abilityName;
        }

        function triggerAbility() {
            if (!currentRace) return;
            const now = Date.now();
            if (now - lastAbilityTime < currentRace.cooldown) return;
            lastAbilityTime = now;

            if (currentRace.name === 'Werewolf') {
                isPouncing = true;
                playerMesh.getWorldDirection(pounceDirection);
                setTimeout(() => isPouncing = false, 300);
            } else if (currentRace.name === 'Vampire' || currentRace.name === 'Cadaver') {
                createPulseEffect(currentRace.color);
            } else if (currentRace.name === 'Ghost') {
                const origSpeed = currentRace.speed;
                currentRace.speed *= 1.8;
                playerMesh.material.opacity = 0.4;
                playerMesh.material.transparent = true;
                setTimeout(() => {
                    currentRace.speed = origSpeed;
                    playerMesh.material.opacity = 1.0;
                }, 3000);
            }
        }

        function createPulseEffect(colorHex) {
            const ringGeo = new THREE.RingGeometry(0.1, 4, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(playerMesh.position);
            ring.position.y = 0.05;
            scene.add(ring);
            let scale = 1;
            const interval = setInterval(() => {
                scale += 0.2;
                ring.scale.set(scale, scale, 1);
                ring.material.opacity -= 0.08;
                if (ring.material.opacity <= 0) {
                    clearInterval(interval);
                    scene.remove(ring);
                }
            }, 30);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let active = false, startX, startY;

            zone.addEventListener('touchstart', (e) => {
                active = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!active) return;
                const touch = e.touches[0];
                let dx = touch.clientX - startX;
                let dy = touch.clientY - startY;
                const dist = Math.min(Math.hypot(dx, dy), 32);
                const angle = Math.atan2(dy, dx);
                
                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;
                stick.style.transform = `translate(${stickX}px, ${stickY}px)`;

                moveVector.set(stickX / 32, 0, stickY / 32);
            });

            window.addEventListener('touchend', () => {
                active = false;
                stick.style.transform = `translate(0px, 0px)`;
                moveVector.set(0, 0, 0);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = 0.016;

            if (currentRace) {
                if (isPouncing) {
                    playerMesh.position.addScaledVector(pounceDirection, pounceSpeed * delta);
                } else if (moveVector.lengthSq() > 0.01) {
                    playerMesh.position.x += moveVector.x * currentRace.speed * delta;
                    playerMesh.position.z += moveVector.z * currentRace.speed * delta;
                    playerMesh.rotation.y = Math.atan2(moveVector.x, moveVector.z);
                }
                camera.position.x = playerMesh.position.x;
                camera.position.z = playerMesh.position.z + 11;
                camera.lookAt(playerMesh.position);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initScene;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DEJAVU 3D - Combat</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; margin: 0; padding: 0; }
        body { overflow: hidden; background: #05050a; font-family: sans-serif; user-select: none; width: 100vw; height: 100vh; }
        
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #05050c; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .screen h1 { color: #f8fafc; font-size: 22px; letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; text-align: center; }
        
        .grid-2 { display: flex; gap: 15px; width: 85%; max-width: 320px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 320px; }
        
        .btn {
            flex: 1; background: #1e1b4b; border: 2px solid #8b5cf6;
            color: #fff; padding: 20px 10px; text-align: center; font-weight: bold;
            border-radius: 14px; cursor: pointer; text-transform: uppercase; font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: #8b5cf6; transform: scale(0.95); }

        #hud { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 500; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        #minimap-container {
            position: absolute; top: 20px; right: 20px; width: 90px; height: 90px;
            border-radius: 50%; border: 2px solid rgba(139, 92, 246, 0.8);
            background: rgba(5, 5, 12, 0.85); overflow: hidden;
        }
        #minimap { width: 100%; height: 100%; }

        #hero-info {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-weight: bold; font-size: 13px;
            background: rgba(5,5,12,0.85); padding: 8px 14px; border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.5);
        }

        #ability-btn {
            position: absolute; bottom: 35px; right: 35px; width: 85px; height: 85px;
            background: radial-gradient(circle, #8b5cf6 0%, #4c1d95 100%);
            border: 2px solid #ddd6fe; border-radius: 50%; color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.7); font-size: 13px; text-align: center;
        }
        #ability-btn:active { transform: scale(0.92); }

        #joystick-zone { position: absolute; bottom: 35px; left: 35px; width: 110px; height: 110px; border: 2px dashed rgba(255,255,255,0.25); border-radius: 50%; }
        #joystick-stick { position: absolute; top: 30px; left: 30px; width: 48px; height: 48px; background: rgba(255,255,255,0.5); border-radius: 50%; }
    </style>

    <script>
        window.selectedGender = 'MALE';
        window.selectedRaceKey = null;

        window.chooseGender = function(gender) {
            window.selectedGender = gender;
            document.getElementById('gender-select').style.display = 'none';
            document.getElementById('race-select').style.display = 'flex';
        };

        window.selectRace = function(raceKey) {
            window.selectedRaceKey = raceKey;
            document.getElementById('race-select').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            
            const gTag = window.selectedGender === 'MALE' ? 'Чоловік' : 'Жінка';
            const rNames = { WEREWOLF: 'Вовкулака', VAMPIRE: 'Вампір', CADAVER: 'Кадавр', GHOST: 'Привид' };
            document.getElementById('hero-title').innerText = `${rNames[raceKey]} (${gTag})`;

            if (window.start3D) {
                window.start3D();
            }
        };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="gender-select" class="screen">
        <h1>Обери стать героя</h1>
        <div class="grid-2">
            <div class="btn" onclick="chooseGender('MALE')">Чоловік ♂</div>
            <div class="btn" onclick="chooseGender('FEMALE')">Жінка ♀</div>
        </div>
    </div>

    <div id="race-select" class="screen" style="display: none;">
        <h1>Обери расу</h1>
        <div class="grid-4">
            <div class="btn" onclick="selectRace('WEREWOLF')">Вовкулака</div>
            <div class="btn" onclick="selectRace('VAMPIRE')">Вампір</div>
            <div class="btn" onclick="selectRace('CADAVER')">Кадавр</div>
            <div class="btn" onclick="selectRace('GHOST')">Привид</div>
        </div>
    </div>

    <div id="hud">
        <div id="hero-info"><span id="hero-title">HERO</span></div>
        <div id="minimap-container">
            <canvas id="minimap" width="90" height="90"></canvas>
        </div>
        <div id="joystick-zone" class="interactive">
            <div id="joystick-stick"></div>
        </div>
        <div id="ability-btn" class="interactive" onclick="triggerAbility()">ABILITY</div>
    </div>

    <script>
        let scene, camera, renderer, playerGroup, playerLight, heroGroup;
        let armL, armR, legL, legR, swordMesh;
        let moveVector = new THREE.Vector3();
        let isPouncing = false, pounceDir = new THREE.Vector3(), pounceSpeed = 24;
        let lastAbility = 0;
        let mapCtx;
        let enemies = [];

        // Reduced movement speed for smoother control
        const RACES = {
            WEREWOLF: { color: 0xa855f7, isGhost: false, speed: 7.5, ability: 'Pounce' },
            VAMPIRE: { color: 0xef4444, isGhost: false, speed: 6.8, ability: 'Siphon' },
            CADAVER: { color: 0x22c55e, isGhost: false, speed: 5.8, ability: 'Slam' },
            GHOST: { color: 0x06b6d4, isGhost: true, speed: 8.2, ability: 'Phase' }
        };

        window.start3D = function() {
            const raceData = RACES[window.selectedRaceKey] || RACES.WEREWOLF;
            document.getElementById('ability-btn').innerText = raceData.ability;

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080914);
            scene.fog = new THREE.FogExp2(0x080914, 0.025);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 11);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const hemi = new THREE.HemisphereLight(0xc7d2fe, 0x311b92, 1.2);
            scene.add(hemi);

            const dir = new THREE.DirectionalLight(0xffffff, 1.5);
            dir.position.set(15, 25, 10);
            scene.add(dir);

            // Floor & Grid
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(60, 60),
                new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(60, 30, 0x6366f1, 0x1f2937);
            grid.position.y = 0.01;
            scene.add(grid);

            const mapCanvas = document.getElementById('minimap');
            mapCtx = mapCanvas.getContext('2d');

            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            playerLight = new THREE.PointLight(raceData.color, 4, 14);
            playerLight.position.set(0, 2.5, 0);
            playerGroup.add(playerLight);

            buildDarkKnightModel(raceData);
            spawnEnemies();
            setupJoystick();

            window.addEventListener('resize', onResize);
            animate();
        };

        // Dark Knight / Rogue Humanoid Mesh with Glowing Visor & Sword
        function buildDarkKnightModel(raceData) {
            heroGroup = new THREE.Group();
            const isFemale = window.selectedGender === 'FEMALE';
            const auraColor = raceData.color;
            const opacity = raceData.isGhost ? 0.55 : 1.0;
            const transparent = raceData.isGhost;

            const armorMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.3, metalness: 0.8, transparent, opacity });
            const clothMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, transparent, opacity });
            const glowMat = new THREE.MeshBasicMaterial({ color: auraColor });

            const shoulder = isFemale ? 0.75 : 1.1;
            const waist = isFemale ? 0.5 : 0.8;

            // Torso Armor Plate
            const chest = new THREE.Mesh(new THREE.BoxGeometry(0.75 * shoulder, 0.75, 0.45), armorMat);
            chest.position.y = 1.45;
            heroGroup.add(chest);

            // Belt & Tassets
            const belt = new THREE.Mesh(new THREE.BoxGeometry(0.65 * waist, 0.35, 0.4), clothMat);
            belt.position.y = 1.0;
            heroGroup.add(belt);

            // Pauldrons (Spiked Shoulders)
            const pL = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), armorMat);
            pL.position.set(-0.48 * shoulder, 1.65, 0);
            const pR = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), armorMat);
            pR.position.set(0.48 * shoulder, 1.65, 0);
            heroGroup.add(pL);
            heroGroup.add(pR);

            // Helmet with Visor Glow
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), armorMat);
            head.position.y = 2.05;
            heroGroup.add(head);

            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.08, 0.05), glowMat);
            visor.position.set(0, 2.08, 0.2);
            heroGroup.add(visor);

            // Arms & Sword
            const armGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.7);
            armL = new THREE.Mesh(armGeo, armorMat);
            armL.position.set(-0.48 * shoulder, 1.3, 0);
            armR = new THREE.Mesh(armGeo, armorMat);
            armR.position.set(0.48 * shoulder, 1.3, 0);
            heroGroup.add(armL);
            heroGroup.add(armR);

            // Sword in Right Hand
            swordMesh = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.1, 0.12), armorMat);
            swordMesh.position.set(0, -0.4, 0.3);
            swordMesh.rotation.x = Math.PI / 3;
            armR.add(swordMesh);

            // Legs
            if (!raceData.isGhost) {
                const legGeo = new THREE.CylinderGeometry(0.1, 0.08, 0.8);
                legL = new THREE.Mesh(legGeo, armorMat);
                legL.position.set(-0.18, 0.4, 0);
                legR = new THREE.Mesh(legGeo, armorMat);
                legR.position.set(0.18, 0.4, 0);
                heroGroup.add(legL);
                heroGroup.add(legR);
            } else {
                const mantle = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 8), clothMat);
                mantle.position.set(0, 0.6, -0.1);
                mantle.rotation.x = 0.2;
                heroGroup.add(mantle);
            }

            // Dark Cape
            const cape = new THREE.Mesh(new THREE.BoxGeometry(0.65, 1.1, 0.04), clothMat);
            cape.position.set(0, 1.15, -0.24);
            cape.rotation.x = 0.12;
            heroGroup.add(cape);

            playerGroup.add(heroGroup);
        }

        function spawnEnemies() {
            enemies = [];
            const mat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
            const geo = new THREE.CylinderGeometry(0.75, 0.75, 1.8, 16);

            for (let i = 0; i < 3; i++) {
                const enemyGroup = new THREE.Group();
                const mesh = new THREE.Mesh(geo, mat.clone());
                mesh.position.y = 0.9;
                enemyGroup.add(mesh);

                // HP Bar sprite
                const hpCanvas = document.createElement('canvas');
                hpCanvas.width = 64; hpCanvas.height = 12;
                const hpCtx = hpCanvas.getContext('2d');
                hpCtx.fillStyle = '#ef4444'; hpCtx.fillRect(0, 0, 64, 12);

                const hpTexture = new THREE.CanvasTexture(hpCanvas);
                const hpSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: hpTexture }));
                hpSprite.position.set(0, 2.2, 0);
                hpSprite.scale.set(1.6, 0.3, 1);
                enemyGroup.add(hpSprite);

                enemyGroup.position.set((i - 1) * 8, 0, -8);
                enemyGroup.userData = { hp: 100, mesh: mesh, hpCtx: hpCtx, hpTexture: hpTexture, hpSprite: hpSprite };

                scene.add(enemyGroup);
                enemies.push(enemyGroup);
            }
        }

        window.triggerAbility = function() {
            const raceData = RACES[window.selectedRaceKey];
            if (!raceData) return;
            const now = Date.now();
            if (now - lastAbility < 2000) return;
            lastAbility = now;

            // Attack Dash / Pounce Logic
            isPouncing = true;
            playerGroup.getWorldDirection(pounceDir);
            
            // Visual Slash Wave Ring Effect
            createSlashWave(raceData.color);

            setTimeout(() => {
                isPouncing = false;
                checkCombatHit(raceData);
            }, 250);
        };

        function createSlashWave(colorHex) {
            const ringGeo = new THREE.RingGeometry(0.5, 4.5, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(playerGroup.position);
            ring.position.y = 0.1;
            scene.add(ring);

            let s = 1;
            const interval = setInterval(() => {
                s += 0.3;
                ring.scale.set(s, s, 1);
                ring.material.opacity -= 0.1;
                if (ring.material.opacity <= 0) {
                    clearInterval(interval);
                    scene.remove(ring);
                }
            }, 25);
        }

        function checkCombatHit(raceData) {
            const pPos = playerGroup.position;
            enemies.forEach(enemy => {
                if (enemy.userData.hp <= 0) return;

                const dist = pPos.distanceTo(enemy.position);
                if (dist < 4.5) { // Hit Range
                    enemy.userData.hp -= 40; // Deal 40 Damage
                    
                    // Enemy Blink Red
                    enemy.userData.mesh.material.color.setHex(0xffffff);
                    setTimeout(() => enemy.userData.mesh.material.color.setHex(0xef4444), 150);

                    // Knockback
                    const kb = enemy.position.clone().sub(pPos).normalize().multiplyScalar(1.5);
                    enemy.position.add(kb);

                    // Update HP Bar
                    const ctx = enemy.userData.hpCtx;
                    ctx.clearRect(0, 0, 64, 12);
                    ctx.fillStyle = '#334155'; ctx.fillRect(0, 0, 64, 12);
                    ctx.fillStyle = '#22c55e'; ctx.fillRect(0, 0, Math.max(0, (enemy.userData.hp / 100) * 64), 12);
                    enemy.userData.hpTexture.needsUpdate = true;

                    // Defeat enemy
                    if (enemy.userData.hp <= 0) {
                        scene.remove(enemy);
                    }
                }
            });
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let active = false, sX, sY;

            zone.addEventListener('touchstart', (e) => {
                active = true;
                const t = e.touches[0];
                sX = t.clientX; sY = t.clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!active) return;
                const t = e.touches[0];
                let dx = t.clientX - sX, dy = t.clientY - sY;
                const dist = Math.min(Math.hypot(dx, dy), 35);
                const angle = Math.atan2(dy, dx);
                const stickX = Math.cos(angle) * dist, stickY = Math.sin(angle) * dist;
                stick.style.transform = `translate(${stickX}px, ${stickY}px)`;
                moveVector.set(stickX / 35, 0, stickY / 35);
            });

            window.addEventListener('touchend', () => {
                active = false;
                stick.style.transform = `translate(0px, 0px)`;
                moveVector.set(0, 0, 0);
            });
        }

        function drawMinimap() {
            if (!mapCtx) return;
            mapCtx.clearRect(0, 0, 90, 90);
            const c = 45, s = 1.5;

            mapCtx.fillStyle = '#22c55e';
            mapCtx.beginPath();
            mapCtx.arc(c + playerGroup.position.x * s, c + playerGroup.position.z * s, 4, 0, Math.PI * 2);
            mapCtx.fill();

            mapCtx.fillStyle = '#ef4444';
            enemies.forEach(e => {
                if (e.userData.hp > 0) {
                    mapCtx.beginPath();
                    mapCtx.arc(c + e.position.x * s, c + e.position.z * s, 3, 0, Math.PI * 2);
                    mapCtx.fill();
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = 0.016;
            const time = Date.now() * 0.01;

            if (playerGroup) {
                const raceData = RACES[window.selectedRaceKey];

                if (raceData && raceData.isGhost && heroGroup) {
                    heroGroup.position.y = 0.3 + Math.sin(time * 0.5) * 0.1;
                }

                if (isPouncing) {
                    playerGroup.position.addScaledVector(pounceDir, pounceSpeed * delta);
                } else if (moveVector.lengthSq() > 0.01) {
                    const spd = raceData ? raceData.speed : 7;
                    playerGroup.position.x += moveVector.x * spd * delta;
                    playerGroup.position.z += moveVector.z * spd * delta;
                    playerGroup.rotation.y = Math.atan2(moveVector.x, moveVector.z);

                    if (armL) armL.rotation.x = Math.sin(time) * 0.4;
                    if (armR) armR.rotation.x = -Math.sin(time) * 0.4;
                    if (legL) legL.rotation.x = -Math.sin(time) * 0.5;
                    if (legR) legR.rotation.x = Math.sin(time) * 0.5;
                } else {
                    if (armL) armL.rotation.x = 0;
                    if (armR) armR.rotation.x = 0;
                    if (legL) legL.rotation.x = 0;
                    if (legR) legR.rotation.x = 0;
                }

                camera.position.x = playerGroup.position.x;
                camera.position.z = playerGroup.position.z + 11;
                camera.lookAt(playerGroup.position);

                drawMinimap();
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            r

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DEJAVU 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0d17; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Race Selection UI */
        #race-select {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 13, 23, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        #race-select h1 { color: #f8fafc; font-size: 28px; letter-spacing: 3px; margin-bottom: 25px; text-shadow: 0 0 12px #8b5cf6; }
        .race-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 320px; }
        .race-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(139, 92, 246, 0.4);
            color: #f8fafc; padding: 18px 10px; text-align: center; font-weight: bold;
            border-radius: 12px; cursor: pointer; text-transform: uppercase; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .race-btn:active { background: #8b5cf6; transform: scale(0.96); }

        /* HUD UI */
        #hud { display: none; width: 100%; height: 100%; position: relative; }
        #ability-btn {
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
            background: radial-gradient(circle, #8b5cf6 0%, #6d28d9 100%);
            border: 2px solid #ddd6fe; border-radius: 50%; color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.7); font-size: 13px; text-align: center;
        }
        #ability-btn:active { transform: scale(0.92); }

        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 50%; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div id="race-select" class="interactive">
            <h1>SELECT YOUR RACE</h1>
            <div class="race-grid">
                <div class="race-btn" onclick="selectRace('WEREWOLF')">Werewolf</div>
                <div class="race-btn" onclick="selectRace('VAMPIRE')">Vampire</div>
                <div class="race-btn" onclick="selectRace('CADAVER')">Cadaver</div>
                <div class="race-btn" onclick="selectRace('GHOST')">Ghost</div>
            </div>
        </div>
        <div id="hud">
            <div id="joystick-zone" class="interactive">
                <div id="joystick-stick"></div>
            </div>
            <div id="ability-btn" class="interactive" onclick="triggerAbility()">ABILITY</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, playerGroup, playerBodyMat, torchLights = [];
        let currentRace = null;
        let moveVector = new THREE.Vector3();
        let isPouncing = false, pounceDirection = new THREE.Vector3(), pounceSpeed = 30;
        let lastAbilityTime = 0;

        const RACES = {
            WEREWOLF: { name: 'Werewolf', color: 0xa855f7, speed: 11, cooldown: 4000, abilityName: 'Pounce' },
            VAMPIRE: { name: 'Vampire', color: 0xef4444, speed: 10, cooldown: 5000, abilityName: 'Siphon' },
            CADAVER: { name: 'Cadaver', color: 0x22c55e, speed: 8.5, cooldown: 8000, abilityName: 'Slam' },
            GHOST: { name: 'Ghost', color: 0x06b6d4, speed: 12.5, cooldown: 6000, abilityName: 'Phase' }
        };

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c16);
            scene.fog = new THREE.FogExp2(0x0a0c16, 0.035);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 13);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting setup
            const ambient = new THREE.AmbientLight(0x3b82f6, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xa78bfa, 0.8);
            dirLight.position.set(15, 25, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            buildTavernEnvironment();
            createPlayerModel();

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            animate();
        }

        function buildTavernEnvironment() {
            // Stone floor
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1b2e, roughness: 0.9, metalness: 0.1 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Floor Grid Accent
            const grid = new THREE.GridHelper(50, 25, 0x6d28d9, 0x1e1b2e);
            grid.position.y = 0.02;
            scene.add(grid);

            // Walls & Columns
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
            const columnGeo = new THREE.BoxGeometry(2, 8, 2);

            const positions = [
                [-20, 4, -20], [20, 4, -20], [-20, 4, 20], [20, 4, 20],
                [-10, 4, -20], [10, 4, -20], [-20, 4, 0], [20, 4, 0]
            ];

            positions.forEach(pos => {
                const col = new THREE.Mesh(columnGeo, wallMat);
                col.position.set(...pos);
                col.castShadow = true;
                scene.add(col);

                // Add torch lights on columns
                const torch = new THREE.PointLight(0xf59e0b, 1.5, 12);
                torch.position.set(pos[0], 5, pos[2]);
                scene.add(torch);
                torchLights.push(torch);
            });

            // Dungeon Exit Portal
            const portalGeo = new THREE.TorusGeometry(3, 0.4, 16, 32);
            const portalMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6 });
            const portal = new THREE.Mesh(portalGeo, portalMat);
            portal.position.set(0, 3.5, -22);
            scene.add(portal);

            const portalLight = new THREE.PointLight(0x8b5cf6, 3, 15);
            portalLight.position.set(0, 3.5, -21);
            scene.add(portalLight);
        }

        function createPlayerModel() {
            playerGroup = new THREE.Group();

            // Stylized Character Body (Chest + Head + Lantern)
            playerBodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 });
            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.4, 1.8, 12);
            const body = new THREE.Mesh(bodyGeo, playerBodyMat);
            body.position.y = 1.1;
            body.castShadow = true;
            playerGroup.add(body);

            const headGeo = new THREE.SphereGeometry(0.45, 16, 16);
            const head = new THREE.Mesh(headGeo, playerBodyMat);
            head.position.y = 2.2;
            playerGroup.add(head);

            // Personal Lantern Light
            const playerLight = new THREE.PointLight(0xffedd5, 1.2, 10);
            playerLight.position.set(0, 1.8, 0.5);
            playerGroup.add(playerLight);

            scene.add(playerGroup);
        }

        function selectRace(raceKey) {
            currentRace = RACES[raceKey];
            playerBodyMat.color.setHex(currentRace.color);
            document.getElementById('race-select').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('ability-btn').innerText = currentRace.abilityName;
        }

        function triggerAbility() {
            if (!currentRace) return;
            const now = Date.now();
            if (now - lastAbilityTime < currentRace.cooldown) return;
            lastAbilityTime = now;

            if (currentRace.name === 'Werewolf') {
                isPouncing = true;
                playerGroup.getWorldDirection(pounceDirection);
                setTimeout(() => isPouncing = false, 280);
            } else if (currentRace.name === 'Vampire' || currentRace.name === 'Cadaver') {
                createPulseEffect(currentRace.color);
            } else if (currentRace.name === 'Ghost') {
                const origSpeed = currentRace.speed;
                currentRace.speed *= 1.8;
                playerBodyMat.opacity = 0.35;
                playerBodyMat.transparent = true;
                setTimeout(() => {
                    currentRace.speed = origSpeed;
                    playerBodyMat.opacity = 1.0;
                }, 3000);
            }
        }

        function createPulseEffect(colorHex) {
            const ringGeo = new THREE.RingGeometry(0.2, 5, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(playerGroup.position);
            ring.position.y = 0.08;
            scene.add(ring);
            let scale = 1;
            const interval = setInterval(() => {
                scale += 0.25;
                ring.scale.set(scale, scale, 1);
                ring.material.opacity -= 0.07;
                if (ring.material.opacity <= 0) {
                    clearInterval(interval);
                    scene.remove(ring);
                }
            }, 30);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let active = false, startX, startY;

            zone.addEventListener('touchstart', (e) => {
                active = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!active) return;
                const touch = e.touches[0];
                let dx = touch.clientX - startX;
                let dy = touch.clientY - startY;
                const dist = Math.min(Math.hypot(dx, dy), 35);
                const angle = Math.atan2(dy, dx);
                
                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;
                stick.style.transform = `translate(${stickX}px, ${stickY}px)`;

                moveVector.set(stickX / 35, 0, stickY / 35);
            });

            window.addEventListener('touchend', () => {
                active = false;
                stick.style.transform = `translate(0px, 0px)`;
                moveVector.set(0, 0, 0);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = 0.016;

            // Flicker torch lights slightly
            torchLights.forEach(t => t.intensity = 1.3 + Math.sin(Date.now() * 0.008 + t.position.x) * 0.25);

            if (currentRace) {
                if (isPouncing) {
                    playerGroup.position.addScaledVector(pounceDirection, pounceSpeed * delta);
                } else if (moveVector.lengthSq() > 0.01) {
                    playerGroup.position.x += moveVector.x * currentRace.speed * delta;
                    playerGroup.position.z += moveVector.z * currentRace.speed * delta;
                    playerGroup.rotation.y = Math.atan2(moveVector.x, moveVector.z);
                }
                camera.position.x = playerGroup.position.x;
                camera.position.z = playerGroup.position.z + 13;
                camera.lookAt(playerGroup.position);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initScene;
    </script>
</body>
</html>
